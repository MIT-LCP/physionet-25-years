[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twentyfiveyears"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26.4",
    "beautifulsoup4",
    "dimcli",
    "joblib",
    "jupyter",
    "pandas>=2.2",
    "polars>=1.4.1",
    "pymupdf>=1.26",
    "rapidfuzz>=3.9.6",
    "requests>=2.28.0",
    "tqdm>=4.66.5",
    "matplotlib>=3.8.0",
    "seaborn>=0.12.2",
    "plotly>=5.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]
